<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagamento Confirmado — UltraProspec</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(140deg,#071210,#0D3B1E);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem}
.card{background:#fff;border-radius:20px;padding:3rem 2.5rem;max-width:400px;width:100%;text-align:center;box-shadow:0 24px 80px rgba(0,0,0,.35)}
.icon{font-size:4rem;margin-bottom:1.25rem}
h1{font-size:1.5rem;font-weight:900;color:#0D1F14;margin-bottom:.6rem}
p{color:#4B6250;font-size:.95rem;line-height:1.65;margin-bottom:1.5rem}
.credits-pill{display:inline-flex;align-items:center;gap:.5rem;padding:.65rem 1.5rem;background:#F0FFF4;border:2px solid #BBF7D0;border-radius:999px;color:#00962E;font-size:1.1rem;font-weight:800;margin-bottom:1.75rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.85rem 2rem;background:linear-gradient(135deg,#00C853,#00962E);color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;text-decoration:none;transition:all .25s;width:100%}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,200,83,.35)}
.status{font-size:.8rem;color:#aaa;margin-top:1rem}
</style>
</head>
<body>
<div class="card">
  <div class="icon" id="icon">⏳</div>
  <h1 id="title">Verificando pagamento...</h1>
  <p id="desc">Aguarde enquanto confirmamos sua compra.</p>
  <div class="credits-pill" id="pill" style="display:none">
    ⚡ <span id="creditsAdded"></span> leads adicionados!
  </div>
  <a href="app.html" class="btn" id="btnGo" style="display:none">
    🚀 Acessar a plataforma
  </a>
  <p class="status" id="status"></p>
</div>
<script>
var params    = new URLSearchParams(window.location.search);
var sessionId = params.get('session_id');
var credits   = parseInt(params.get('credits') || '0'); // fallback da URL

function addToLocalStorage(n) {
  var key     = 'up_credits';
  var current = parseInt(localStorage.getItem(key) || '0');
  localStorage.setItem(key, String(current + n));
  localStorage.setItem('up_ever_had_credits', '1');
}

function showSuccess(n) {
  document.getElementById('icon').textContent  = '✅';
  document.getElementById('title').textContent = 'Pagamento confirmado!';
  document.getElementById('desc').textContent  = 'Seus leads foram adicionados. Bom trabalho de prospecção!';
  document.getElementById('creditsAdded').textContent = n;
  document.getElementById('pill').style.display  = 'inline-flex';
  document.getElementById('btnGo').style.display = 'inline-flex';
  document.getElementById('status').textContent  = n + ' leads disponíveis na plataforma.';
}

function showError(msg) {
  document.getElementById('icon').textContent  = '⚠️';
  document.getElementById('title').textContent = 'Não foi possível verificar';
  document.getElementById('desc').textContent  = msg || 'Verifique se o pagamento foi concluído.';
  document.getElementById('btnGo').style.display = 'inline-flex';
}

async function verify() {
  if (!sessionId) {
    // Sem session_id — usa credits da URL (fallback)
    if (credits > 0) { addToLocalStorage(credits); showSuccess(credits); }
    else showError('Parâmetros de pagamento inválidos.');
    return;
  }

  try {
    var res  = await fetch('/api/payment/verify?session_id=' + encodeURIComponent(sessionId));
    var data = await res.json();

    if (data.approved) {
      var n = data.credits || 100;
      addToLocalStorage(n);
      showSuccess(n);
    } else if (data.alreadyUsed) {
      // Já foi verificado nesta sessão — considera OK (usuário recarregou a página)
      showSuccess(data.credits || 100);
      document.getElementById('status').textContent = 'Leads já adicionados anteriormente.';
    } else {
      showError('Pagamento ainda não confirmado (status: ' + (data.status || '?') + '). Aguarde alguns segundos e recarregue.');
      setTimeout(verify, 4000);
    }
  } catch(e) {
    showError('Erro de conexão. Tente recarregar a página.');
    document.getElementById('btnGo').style.display = 'inline-flex';
  }
}

verify();
</script>
</body>
</html>
